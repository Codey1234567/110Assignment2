<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            max-width: 80%;
            margin: 0 auto;
        }

        p {
            padding: 10px;
        }

        p.all {
            border: 1px solid black;
        }

        p.red {
            border-bottom: red 1px solid;
        }

        p.round {
            border-radius: 15px;
            border: 1px black groove;
        }

        p.blue {
            border-left: blue solid 5px;
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <p class="all">I have borders on all sides.</p>
    <p class="red">I have a red bottom border.</p>
    <p class="round">I have rounded borders.</p>
    <p class="blue">I have a blue left border.</p>
</body>
</html>
